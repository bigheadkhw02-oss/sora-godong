<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0f9099" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="마법의 소라고동" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>마법의 소라고동</title>
</head>
<body>
  <div class="ocean-glow" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="topbar">
      <h1>마법의 소라고동</h1>
      <div class="actions">
        <button id="installBtn" class="icon-btn install-btn hidden" aria-label="설치">⬇</button>
        <button id="shareBtn" class="icon-btn" aria-label="공유">↗</button>
        <button id="settingsBtn" class="icon-btn" aria-label="설정">⚙</button>
        <button id="helpBtn" class="icon-btn" aria-label="도움말">?</button>
      </div>
    </header>

    <section class="hero-card">
      <div class="hero-bubbles" aria-hidden="true">
        <span class="bubble b1"></span>
        <span class="bubble b2"></span>
        <span class="bubble b3"></span>
        <span class="bubble b4"></span>
        <span class="bubble b5"></span>
      </div>

      <button id="conchBtn" class="conch-btn" aria-label="소라고동 터치">
        <img src="assets/conch-shell.svg" alt="보라색 소라고동" class="conch-image" />
      </button>

      <p class="tap-guide">소라고동을 터치해보세요</p>
    </section>

    <section id="answerCard" class="answer-card" aria-live="polite">
      <div class="answer-label">소라고동의 대답</div>
      <div id="answerText" class="answer-text">터치하면 랜덤으로 대답해줄게.</div>
      <div id="categoryBadge" class="badge">대기 중</div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-box">
      <div class="dialog-title-row">
        <h2>설정</h2>
        <button class="dialog-close" aria-label="닫기">×</button>
      </div>
      <label class="setting-row"><span>진동</span><input type="checkbox" id="vibrateToggle" checked></label>
      <label class="setting-row"><span>효과음</span><input type="checkbox" id="soundToggle" checked></label>
      <label class="setting-row"><span>음성 읽기</span><input type="checkbox" id="ttsToggle"></label>
      <label class="setting-row"><span>혼돈 모드</span><input type="checkbox" id="chaosToggle"></label>
    </form>
  </dialog>

  <dialog id="helpDialog">
    <form method="dialog" class="dialog-box">
      <div class="dialog-title-row">
        <h2>사용법</h2>
        <button class="dialog-close" aria-label="닫기">×</button>
      </div>
      <p>질문 입력 없이 소라고동을 터치하면 랜덤 답변이 나옵니다.</p>
      <p>설치 버튼이 보이면 눌러서 홈 화면 앱처럼 설치할 수 있습니다.</p>
      <p>설치 버튼이 안 보이면 브라우저 메뉴에서 <strong>홈 화면에 추가</strong>를 눌러 설치하면 됩니다.</p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>

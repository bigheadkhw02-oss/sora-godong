<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#083f49" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="마법의 소라고동" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>마법의 소라고동</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>마법의 소라고동</h1>
      <div class="actions">
        <button id="installBtn" class="icon-btn hidden" aria-label="설치">↓</button>
        <button id="settingsBtn" class="icon-btn" aria-label="설정">⚙</button>
      </div>
    </header>

    <section class="stage" aria-label="마법의 소라고동">
      <div class="energy-ring ring-a"></div>
      <div class="energy-ring ring-b"></div>
      <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
      <div class="spark s4"></div><div class="spark s5"></div><div class="spark s6"></div>

      <button id="conchBtn" class="conch-btn" aria-label="소라고동 터치">
        <span class="conch-aura"></span>
        <img src="conch-shell.svg" alt="보라색 소라고동" class="conch-image" />
      </button>
      <div class="tap-text">TAP</div>
    </section>

    <section id="answerCard" class="answer-card" aria-live="polite">
      <div class="answer-label">소라고동의 대답</div>
      <div id="answerText" class="answer-text">터치해보세요.</div>
      <div id="categoryBadge" class="badge">대기 중</div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-box">
      <div class="dialog-title-row">
        <h2>설정</h2>
        <button class="dialog-close" aria-label="닫기">×</button>
      </div>
      <label class="setting-row"><span>진동</span><input type="checkbox" id="vibrateToggle" checked></label>
      <label class="setting-row"><span>효과음</span><input type="checkbox" id="soundToggle" checked></label>
      <label class="setting-row"><span>음성 읽기</span><input type="checkbox" id="ttsToggle"></label>
      <label class="setting-row"><span>혼돈 모드</span><input type="checkbox" id="chaosToggle"></label>
      <button id="shareBtn" class="secondary-btn" type="button">결과 공유</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
